<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Daphine Nakandi — Developer profile</title>
  <desc id="desc">A dark navy developer banner with soft blue, violet and teal blurred light.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset="0.55" stop-color="#10152a"/>
      <stop offset="1" stop-color="#090e1b"/>
    </linearGradient>
    <radialGradient id="blue"><stop stop-color="#287bff" stop-opacity=".85"/><stop offset="1" stop-color="#287bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="violet"><stop stop-color="#8b5cf6" stop-opacity=".8"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity=".55"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#a9b8d0" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#base)"/>
  <g filter="url(#blur)">
    <ellipse cx="220" cy="70" rx="250" ry="150" fill="url(#blue)"/>
    <ellipse cx="900" cy="40" rx="300" ry="190" fill="url(#violet)"/>
    <ellipse cx="720" cy="360" rx="300" ry="150" fill="url(#cyan)"/>
  </g>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M48 48h34M48 48v34M1152 312h-34M1152 312v-34" stroke="#8ba6d9" stroke-opacity=".55" stroke-width="2" fill="none"/>
  <rect x="72" y="82" width="5" height="188" rx="2.5" fill="#67e8f9" opacity=".9"/>
  <text x="104" y="145" fill="#a5b4fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="4">SOFTWARE ENGINEERING • AI</text>
  <text x="100" y="212" fill="#f8fafc" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="54" font-weight="700">Daphine Nakandi</text>
  <text x="104" y="256" fill="#cbd5e1" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="21">Building practical things with Python, Django &amp; AI</text>
  <text x="104" y="310" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2">LEARN  /  BUILD  /  IMPROVE</text>
  <circle cx="1080" cy="112" r="5" fill="#67e8f9"/><circle cx="1100" cy="112" r="5" fill="#818cf8"/><circle cx="1120" cy="112" r="5" fill="#c084fc"/>
</svg>