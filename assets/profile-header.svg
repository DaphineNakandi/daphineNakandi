<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Daphine Nakandi — Developer profile</title>
  <desc id="desc">A refined charcoal and midnight-blue banner with restrained smoky blue-grey and muted lavender light.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10151d"/>
      <stop offset=".55" stop-color="#151b25"/>
      <stop offset="1" stop-color="#111620"/>
    </linearGradient>
    <radialGradient id="mistBlue">
      <stop stop-color="#647b98" stop-opacity=".42"/>
      <stop offset="1" stop-color="#647b98" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistLavender">
      <stop stop-color="#77738f" stop-opacity=".32"/>
      <stop offset="1" stop-color="#77738f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="58"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#b5c0d0" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <linearGradient id="rule" x1="104" y1="0" x2="1090" y2="0">
      <stop stop-color="#9aa9ba" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9aa9ba" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9aa9ba" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#base)"/>
  <g filter="url(#softBlur)">
    <ellipse cx="260" cy="60" rx="280" ry="170" fill="url(#mistBlue)"/>
    <ellipse cx="930" cy="70" rx="310" ry="190" fill="url(#mistLavender)"/>
    <ellipse cx="760" cy="370" rx="300" ry="145" fill="url(#mistBlue)" opacity=".55"/>
  </g>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M104 285H1090" stroke="url(#rule)"/>
  <path d="M72 82v188" stroke="#8b9caf" stroke-opacity=".65" stroke-width="2"/>
  <circle cx="1080" cy="112" r="2.5" fill="#a4afbd" fill-opacity=".65"/>
  <circle cx="1100" cy="112" r="2.5" fill="#a4afbd" fill-opacity=".4"/>
  <circle cx="1120" cy="112" r="2.5" fill="#a4afbd" fill-opacity=".25"/>
  <text x="104" y="145" fill="#aab6c5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" letter-spacing="3.5">SOFTWARE ENGINEERING · AI</text>
  <text x="100" y="212" fill="#edf0f4" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="54" font-weight="600">Daphine Nakandi</text>
  <text x="104" y="256" fill="#b7c0cb" font-family="Inter, ui-sans-serif, Arial, sans-serif" font-size="20">Building practical things with Python, Django &amp; AI</text>
  <text x="104" y="320" fill="#9aa8b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">LEARN  /  BUILD  /  IMPROVE</text>
</svg>